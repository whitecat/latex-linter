# Example: serves the formatter on http://localhost:8000. The access log
# (Apache combined format, for AWStats or similar) is written to ./logs.
services:
  web:
    build: .
    ports:
      - "8000:8000"
    read_only: true
    tmpfs:
      - /tmp
      - /home/app
    volumes:
      - ./logs:/app/logs
    restart: unless-stopped
